<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singla Lady Garments | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background: #050505; color: white; overflow-x: hidden; }
        .hero-title { font-size: clamp(3rem, 10vw, 8rem); line-height: 0.9; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
    </style>
</head>
<body>
    <nav class="flex justify-between p-8 fixed w-full z-50 mix-blend-difference">
        <div class="font-bold text-xl tracking-tighter">SINGLA.</div>
        <div class="space-x-8 text-[10px] uppercase tracking-[0.3em]">
            <a href="index.html" class="border-b border-white">Home</a>
            <a href="shop.html" class="hover:opacity-50">Shop</a>
            <a href="about.html" class="hover:opacity-50">About</a>
        </div>
    </nav>

    <section class="h-screen flex flex-col justify-center px-10">
        <h1 class="hero-title font-light tracking-tighter">MODERN<br><span class="italic text-gray-600">COUTURE</span></h1>
        <p class="max-w-sm mt-6 text-gray-400 text-sm leading-relaxed">Discover the 2026 Winter Collection. Crafted with precision, designed for elegance.</p>
        <div class="mt-10">
            <a href="shop.html" class="px-10 py-4 border border-white/20 hover:bg-white hover:text-black transition duration-500 uppercase text-[10px] tracking-widest">Enter Shop</a>
        </div>
    </section>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.IcosahedronGeometry(10, 1);
        const material = new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        camera.position.z = 20;

        function animate() {
            requestAnimationFrame(animate);
            mesh.rotation.y += 0.003;
            mesh.rotation.x += 0.001;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
