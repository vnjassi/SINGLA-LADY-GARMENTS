<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singla Lady Garments | Premium Collection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #050505; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hero-text { text-shadow: 0px 0px 20px rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <nav class="flex justify-between items-center p-6 fixed w-full z-10">
        <div class="text-2xl font-bold tracking-widest">SINGLA</div>
        <div class="space-x-8 hidden md:flex text-sm uppercase tracking-widest">
            <a href="#" class="hover:text-gray-400 transition">Collection</a>
            <a href="#" class="hover:text-gray-400 transition">Modern</a>
            <a href="#" class="hover:text-gray-400 transition">About</a>
        </div>
        <button class="px-6 py-2 border border-white text-xs uppercase hover:bg-white hover:text-black transition">Shop Now</button>
    </nav>

    <main class="relative min-h-screen flex items-center justify-center text-center px-4">
        <div class="max-w-4xl">
            <h1 class="text-6xl md:text-8xl font-light mb-6 hero-text">ELEGANCE <br> <span class="font-serif italic text-gray-500">Redefined</span></h1>
            <p class="text-gray-400 max-w-md mx-auto mb-10 tracking-wide">Premium lady garments crafted for those who value sophistication and modern style.</p>
            <div class="flex gap-4 justify-center">
                <a href="#explore" class="px-10 py-4 glass hover:bg-white hover:text-black transition duration-500 uppercase text-xs tracking-widest">Explore 2026 Lookbook</a>
            </div>
        </div>
    </main>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create Particles for 3D Depth
        const particlesGeometry = new THREE.BufferGeometry();
        const counts = 3000;
        const positions = new Float32Array(counts * 3);

        for(let i=0; i<counts * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.005, color: 0xffffff });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        camera.position.z = 3;

        // Interaction
        document.addEventListener('mousemove', (e) => {
            const mouseX = (e.clientX / window.innerWidth) - 0.5;
            const mouseY = (e.clientY / window.innerHeight) - 0.5;
            particlesMesh.rotation.y = mouseX * 0.5;
            particlesMesh.rotation.x = mouseY * 0.5;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
